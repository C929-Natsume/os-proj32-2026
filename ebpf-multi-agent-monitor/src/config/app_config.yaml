redis:
  host: 127.0.0.1
  port: 6379
  channel: ebpf_events
  db: 0

llm:
  enabled: false
  api_key: api_key
  model: gpt-4
  endpoint: https://api.openai.com/v1/chat/completions

monitor:
  target_processes:
    - python
    - bash
    - node
    - java

  target_paths:
    - /usr/bin
    - /bin
    - /sbin
    - /usr/local/bin

  bpf:
    ringbuf_size: 262144
    max_events: 10000

logging:
  level: info
  ebpf_log_dir: ../../logs/ebpf_log
  llm_log_dir: ../../logs/llm_log
  alert_log_dir: ../../logs/alerts
