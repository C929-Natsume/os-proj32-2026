whitelist:
  - /bin/ls
  - /bin/bash
  - /usr/bin/python3
  - /usr/bin/curl
  - /usr/bin/wget

blacklist:
  - /tmp/malware
  - /bin/sh
  - /usr/bin/nc
  - /usr/bin/netcat
  - /usr/sbin/tcpdump

alert_rules:
  - name: high_exec_count
    condition: exec_count > 50
    severity: medium

  - name: high_file_access
    condition: file_count > 100
    severity: medium

  - name: suspicious_network
    condition: network_count > 20
    severity: high

  - name: potential_fork_bomb
    condition: child_count > 5
    severity: critical

  - name: port_scanning
    condition: network_count > 10
    severity: high

intra_agent:
  white_path_prefixes:
    - /mnt/e/os2026
    - /tmp/
    - /var/tmp/
  black_path_markers:
    - /etc/shadow
    - /etc/passwd
    - /etc/sudoers
    - /.ssh/
    - /.aws/credentials
    - /.kube/config
    - .env
    - /var/run/docker.sock
  white_rules: []
  black_rules:
    - UNEXPECTED_SHELL_EXEC
    - SENSITIVE_FILE_ACCESS
    - OUT_OF_WORKSPACE_OPERATION
  gray_rules:
    - POSSIBLE_LOGIC_LOOP
  llm_allow_suppress_rules: []
