whitelist:
  - /bin/ls
  - /bin/bash
  - /usr/bin/python3
  - /usr/bin/curl
  - /usr/bin/wget

blacklist:
  - /tmp/malware
  - /bin/sh
  - /usr/bin/nc
  - /usr/bin/netcat
  - /usr/sbin/tcpdump

alert_rules:
  - name: high_exec_count
    condition: exec_count > 50
    severity: medium

  - name: high_file_access
    condition: file_count > 100
    severity: medium

  - name: suspicious_network
    condition: network_count > 20
    severity: high

  - name: potential_fork_bomb
    condition: child_count > 5
    severity: critical

  - name: port_scanning
    condition: network_count > 10
    severity: high
