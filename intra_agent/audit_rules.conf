# comma-separated values
# comments start with '#'

# 白名单路径前缀（命中后优先视为白）
white_path_prefixes=/mnt/e/os2026,/tmp/,/var/tmp/

# 黑名单路径关键片段（命中后优先视为黑）
black_path_markers=/etc/shadow,/etc/passwd,/etc/sudoers,/.ssh/,/.aws/credentials,/.kube/config,.env,/var/run/docker.sock

# 规则级判定（按规则名）
white_rules=
black_rules=UNEXPECTED_SHELL_EXEC,SENSITIVE_FILE_ACCESS,OUT_OF_WORKSPACE_OPERATION
gray_rules=POSSIBLE_LOGIC_LOOP

# 仅这些规则允许被 LLM suppress（默认空，表示黑名单高危不允许 suppress）
llm_allow_suppress_rules=
